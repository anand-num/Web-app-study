  p {
  color: red;
}
</style>
<div>

</div>
<my-box></my-box> 
<script>
class MyBox extends HTMLElement {
  constructor() {
    super();

    const shadow = this.attachShadow({ mode: "closed" });

    shadow.innerHTML = `
      <style>
        p {
          color: blue;
        }
      </style>

      <p>Hello</p>
    `;

    const el = document.querySelector("my-box");

console.log(el.shadowRoot);
  }
}

customElements.define("my-box", MyBox);
