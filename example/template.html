
<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>experimint</title>

</head>
<body>
<template id="card-template">
  <div class="card">
    <h2></h2>
    <p></p>
  </div>
</template>

<script>
const template = document.getElementById("card-template");

const clone = template.content.cloneNode(true);
clone.querySelector("h2").textContent = "Гарчиг";
clone.querySelector("p").textContent = "Энэ бол card-ийн текст";

document.body.appendChild(clone);
</script>
</body>
</html>
